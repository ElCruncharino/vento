pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "vento"

include ':app'
include ':backends'
include ':backends:rfb'
include ':backends:libvnc'
include ':backends:tigervnc'
include ':backends:ironrdp'
include ':backends:freerdp'
include ':backends:realvnc'
include ':backends:rustdesk'
include ':backends:spice'
// Protocol modules live in backends/modules/ but keep their short project paths.
project(':backends:rfb').projectDir = file('backends/modules/rfb')
project(':backends:libvnc').projectDir = file('backends/modules/libvnc')
project(':backends:tigervnc').projectDir = file('backends/modules/tigervnc')
project(':backends:ironrdp').projectDir = file('backends/modules/ironrdp')
project(':backends:freerdp').projectDir = file('backends/modules/freerdp')
project(':backends:realvnc').projectDir = file('backends/modules/realvnc')
project(':backends:rustdesk').projectDir = file('backends/modules/rustdesk')
project(':backends:spice').projectDir = file('backends/modules/spice')
include ':control'

include ':plugins'
include ':plugins:realvnc'
include ':plugins:rustdesk'

include ':realvnc-jni'
project(':realvnc-jni').projectDir = file('realvnc')

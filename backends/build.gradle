plugins {
    id 'com.android.library'
}

// The seam and nothing else: no androidx, no app class, no
// protocol. A protocol is a module under this one, depending on this and on
// nothing else of the app's — so the compiler is what says the seam survived
// another implementation unchanged.
android {
    namespace = 'net.pgaskin.remotedesktop.backend'
    compileSdk 36

    defaultConfig {
        minSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Not AGP's `src/main/`: this project is `backends/` itself, the parent
    // of every module and of the crates, and its Java is the phone's half of
    // the platform, so it lives with the rest of that in `platform/android/`
    // — the files themselves in `java/`, with no package directories over
    // them (javac goes by the `package` line), and their tests beside it in
    // `javatest/` rather than under it, since a source directory takes in
    // everything below it.
    sourceSets {
        main.java.srcDirs = ['platform/android/java']
        test.java.srcDirs = ['platform/android/javatest']
    }

    // The one rule this module keeps that the Linux client keeps too
    // (`BackendOption.settle`), held to one set of cases:
    // `api/tests/options.json`, which `cargo test` reads from the other side.
    // Read at run time from the module's directory, which is where a test
    // runs, so the file is declared as an input of the task, or a changed case
    // would not make it out of date.
    testOptions {
        unitTests.all {
            testLogging {
                events = ["failed"]
                exceptionFormat = "full"
            }
            inputs.file('api/tests/options.json')
                    .withPropertyName('options')
                    .withPathSensitivity(PathSensitivity.RELATIVE)
        }
    }
}

// Nothing here differs between build types, so the release variant's copy of
// the same suite is duplicate work.
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        variant.enableUnitTest = false
    }
}

dependencies {
    // A plain JVM, as `control/` has it: what is tested here is rules, and
    // the classes they are in touch nothing of Android's.
    testImplementation 'junit:junit:4.13.2'
}

// What every protocol module's native build needs, so that a protocol's own
// build file says only what that protocol needs. `nativeAbis` is what a module
// *can* build; what a build *ships* is the app's `ndk.abiFilters`, a subset.
ext {
    cargoWorkspace = project.file('..')
    cargoRustToolchain = project.file('../rust-toolchain.toml')
    cargoNdkVersion = '4.1.2'
    // The linker's pin, taken by CargoBuildTask from each module's `ndkVersion`
    // rather than from the environment. r27 and later align to 16 KB by default.
    nativeNdkVersion = '28.2.13676358'
    nativeAbis = ['arm64-v8a', 'x86_64']
}

/*
 * What Rust says a backend is, as Java its module compiles: `vento-codegen`
 * (`platform/android/codegen/`) writes the catalog's entry for the backend — id, name,
 * description, place in a picker, and every option with its key as a
 * constant — and the module's provider answers from it. A generated source
 * directory, one per variant, decided by AGP: nothing of it is in the tree,
 * and `codegenSources` is everything it can depend on, so the task is out of
 * date exactly when the catalog may have changed. That includes each
 * backend's own entry, `modules/<name>/catalog.rs`, which the `api` crate
 * compiles by path from outside its own directory: left out, a changed
 * option would be a stale Java catalog.
 */
ext.codegenSources = files(
        '../Cargo.toml', '../Cargo.lock', '../rust-toolchain.toml',
        'platform/android/codegen/Cargo.toml', 'platform/android/codegen/src',
        'api/Cargo.toml', 'api/build.rs', 'api/src',
        file('modules').listFiles().findAll { it.isDirectory() }.sort().collect { new File(it, 'catalog.rs') },
        'platform/android/Cargo.toml', 'platform/android/src',
        'runtime/Cargo.toml', 'runtime/src')

ext.generateCatalog = { Project module, variant, String backend, String className ->
    final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
    final task = module.tasks.register("generate${cap}Catalog", GenerateJavaTask) {
        workspaceDir.set(cargoWorkspace)
        generatorSources.from(codegenSources)
        arguments.set(['catalog', backend, module.android.namespace, className])
    }
    variant.sources.java?.addGeneratedSourceDirectory(task) { it.outputDir }
}

/*
 * A Rust backend's natives class, `<className>` in the module's package: the
 * `native` methods of `NativeBackend.Natives`, out of the JNI table in
 * `platform/android/src/surface.rs`, on a class that loads `library`. One per
 * module rather than one shared class because each library registers its
 * functions on a class from its `JNI_OnLoad`, and two libraries registering
 * on one class would leave the last one loaded answering for both.
 */
ext.generateNatives = { Project module, variant, String className, String library ->
    final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
    final task = module.tasks.register("generate${cap}Natives", GenerateJavaTask) {
        workspaceDir.set(cargoWorkspace)
        generatorSources.from(codegenSources)
        arguments.set(['natives', module.android.namespace, className, library])
    }
    variant.sources.java?.addGeneratedSourceDirectory(task) { it.outputDir }
}

/*
 * A C backend's Rust half, for its CMake to link: the module's crate — the
 * backend as an `api::Backend` over the C library's vtable, and the one JNI
 * layer in `platform/android` registered on the module's natives class — as a
 * static library per ABI, under the directory returned, which the module hands
 * CMake as `VENTO_RUST_LIBRARY_DIR` (`platform/android/cmake/vento_android.cmake`
 * links it).
 *
 * One task for every variant, since each builds the crate `--release` alike,
 * and before any CMake build, which links what it leaves; CMake itself only
 * names the file, so configuring needs nothing of it.
 */
ext.rustStaticLibrary = { Project module, String crate ->
    final out = module.layout.buildDirectory.dir('generated/rustStaticLibs')
    final task = module.tasks.register('cargoBuildStaticNative', CargoBuildTask) {
        workspaceDir.set(cargoWorkspace)
        cargoPackage.set(crate)
        crateType.set('staticlib')
        ndkDirectory.set(module.androidComponents.sdkComponents.ndkDirectory)
        rustToolchainFile.set(cargoRustToolchain)
        cargoNdkVersion.set(project.cargoNdkVersion)
        abiFilters.set(nativeAbis)
        minSdkVersion.set(module.provider {
            final v = module.android.defaultConfig.minSdk
            (v instanceof com.android.build.api.variant.AndroidVersion) ? v.apiLevel : v
        })
        outputDir.set(out)
    }
    module.tasks.matching { it.name.startsWith('buildCMake') }.configureEach {
        dependsOn task
    }
    return out.get().asFile.absolutePath
}

/*
 * The two upstreams that arrive as a release rather than as a submodule, both
 * of them the encryption the borrowed VNC clients reach TLS through. Their git
 * trees have no `configure` — it is an autotools bootstrap output, and gnutls'
 * bootstrap wants gnulib and four host tools — so what a release carries is
 * what upstream *is* here, named by a hash rather than by a gitlink.
 *
 * Their versions, hashes and mirrors are in `crypto-sources.txt`, which the
 * host CMake build reads too: a host build unpacks a missing tree itself, the
 * way the tasks here do. The phone's build fetches nothing;
 * `./gradlew fetchCryptoSources` does, and a tree that is not there is a
 * message from its CMake saying so.
 */
ext.cryptoSources = [:]
file('crypto-sources.txt').eachLine { line ->
    line = line.trim()
    if (!line || line.startsWith('#')) {
        return
    }
    final m = line =~ /^([a-z0-9]+)\.(version|sha256|url)\s*=\s*(\S+)$/
    if (!m.matches()) {
        throw new GradleException("crypto-sources.txt: not a `<name>.<key> = <value>` line: ${line}")
    }
    final pin = cryptoSources.computeIfAbsent(m.group(1)) { [urls: []] }
    if (m.group(2) == 'url') {
        pin.urls << m.group(3)
    } else {
        pin[m.group(2)] = m.group(3)
    }
}

def fetchTasks = cryptoSources.collect { name, pin ->
    tasks.register("fetch${name.capitalize()}Sources", DownloadSourceTarball) {
        group = 'build setup'
        description = "Unpacks ${name} ${pin.version} into third_party/${name}/."
        urls.set(pin.urls)
        sha256.set(pin.sha256)
        stripComponents.set(1)
        outputDir.set(rootProject.layout.projectDirectory.dir("third_party/${name}"))
    }
}

tasks.register('fetchCryptoSources') {
    group = 'build setup'
    description = 'Unpacks every upstream that arrives as a release tarball.'
    dependsOn fetchTasks
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

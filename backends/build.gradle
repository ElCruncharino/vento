plugins {
    id 'com.android.library'
}

// The seam and nothing else: five files, no androidx, no app class, no
// protocol. A protocol is a module under this one, depending on this and on
// nothing else of the app's — so the compiler is what says the seam survived
// another implementation unchanged.
android {
    namespace = 'net.pgaskin.remotedesktop.backend'
    compileSdk 36

    defaultConfig {
        minSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // The rules this module keeps that the Linux client keeps too, held to one
    // set of cases: `vectors/`, which `cargo test` reads from the other side.
    // Read at run time from the module's directory, which is where a test
    // runs, so they are declared as an input of the task, or a changed case
    // would not make it out of date.
    testOptions {
        unitTests.all {
            testLogging {
                events = ["failed"]
                exceptionFormat = "full"
            }
            inputs.dir('vectors')
                    .withPropertyName('vectors')
                    .withPathSensitivity(PathSensitivity.RELATIVE)
        }
    }
}

// Nothing here differs between build types, so the release variant's copy of
// the same suite is duplicate work.
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        variant.enableUnitTest = false
    }
}

dependencies {
    // A plain JVM, as `control/` has it: what is tested here is rules, and
    // the classes they are in touch nothing of Android's.
    testImplementation 'junit:junit:4.13.2'
}

// What every protocol module's native build needs, so that a protocol's own
// build file says only what that protocol needs. `nativeAbis` is what a module
// *can* build; what a build *ships* is the app's `ndk.abiFilters`, a subset.
ext {
    cargoWorkspace = project.file('..')
    cargoRustToolchain = project.file('../rust-toolchain.toml')
    cargoNdkVersion = '4.1.2'
    // The linker's pin, taken by CargoBuildTask from each module's `ndkVersion`
    // rather than from the environment. r27 and later align to 16 KB by default.
    nativeNdkVersion = '28.2.13676358'
    nativeAbis = ['arm64-v8a', 'x86_64']
}

/*
 * What Rust says a backend is, as Java its module compiles: `vento-codegen`
 * (`codegen/`) writes the catalog's entry for the backend — id, name,
 * description, place in a picker, and every option with its key as a
 * constant — and the module's provider answers from it. A generated source
 * directory, one per variant, decided by AGP: nothing of it is in the tree,
 * and `codegenSources` is everything it can depend on, so the task is out of
 * date exactly when the catalog may have changed.
 */
ext.codegenSources = files(
        '../Cargo.toml', '../Cargo.lock', '../rust-toolchain.toml',
        'codegen/Cargo.toml', 'codegen/src',
        'session/Cargo.toml', 'session/build.rs', 'session/src',
        'common/Cargo.toml', 'common/src')

ext.generateCatalog = { Project module, variant, String backend, String className ->
    final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
    final task = module.tasks.register("generate${cap}Catalog", GenerateJavaTask) {
        workspaceDir.set(cargoWorkspace)
        generatorSources.from(codegenSources)
        arguments.set(['catalog', backend, module.android.namespace, className])
    }
    variant.sources.java?.addGeneratedSourceDirectory(task) { it.outputDir }
}

/*
 * The two upstreams that arrive as a release rather than as a submodule, both
 * of them the encryption the borrowed VNC clients reach TLS through. Their git
 * trees have no `configure` — it is an autotools bootstrap output, and gnutls'
 * bootstrap wants gnulib and four host tools — so what a release carries is
 * what upstream *is* here, named by a hash rather than by a gitlink.
 *
 * Nothing in a build fetches these; `./gradlew fetchCryptoSources` does, and a
 * tree that is not there is a message from CMake saying so.
 */
ext.cryptoSources = [
        nettle: [
                version: '4.0',
                sha256 : '3addbc00da01846b232fb3bc453538ea5468da43033f21bb345cb1e9073f5094',
                urls   : [
                        'https://ftp.gnu.org/gnu/nettle/nettle-4.0.tar.gz',
                        'https://www.lysator.liu.se/~nisse/archive/nettle-4.0.tar.gz',
                ],
        ],
        gnutls: [
                version: '3.8.13',
                sha256 : 'ffed8ec1bf09c2426d4f14aae377de4753b53e537d685e604e99a8b16ca9c97e',
                urls   : [
                        'https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.13.tar.xz',
                        'https://mirrors.dotsrc.org/gcrypt/gnutls/v3.8/gnutls-3.8.13.tar.xz',
                ],
        ],
]

def fetchTasks = cryptoSources.collect { name, pin ->
    tasks.register("fetch${name.capitalize()}Sources", DownloadSourceTarball) {
        group = 'build setup'
        description = "Unpacks ${name} ${pin.version} into third_party/${name}/."
        urls.set(pin.urls)
        sha256.set(pin.sha256)
        stripComponents.set(1)
        outputDir.set(rootProject.layout.projectDirectory.dir("third_party/${name}"))
    }
}

tasks.register('fetchCryptoSources') {
    group = 'build setup'
    description = 'Unpacks every upstream that arrives as a release tarball.'
    dependsOn fetchTasks
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

plugins {
    id 'com.android.library'
}

// The three parts of the TigerVNC backend: `cpp/`, a shim over TigerVNC's own
// client code that names no platform other than through the two media sinks
// beside it; the crate at this directory's root (`Cargo.toml`, `src/`), the
// backend as an `api::Backend` over the shim (used directly by the Linux
// client) and the JNI layer every backend shares, registered on the generated
// natives class; and the provider in `java/`, which holds a session as a
// `NativeBackend`. The AAR carries the one library CMake links the first two
// into.
//
// As with libvncclient, the native source is not in this directory: it is
// `third_party/tigervnc`, a submodule at the repository root, pinned by its
// gitlink and patched from `patches/`. The module compiles C++, so it sets the
// C++ runtime: static, so the library carries its own copy.

// The crate at this directory's root, as the static library CMake links in:
// see `rustStaticLibrary` in :backends.
final rustLibraries = project(':backends').rustStaticLibrary(project, 'remotedesktop-tigervnc')

android {
    namespace = 'net.pgaskin.remotedesktop.backend.tigervnc'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 34
        externalNativeBuild {
            cmake {
                targets 'remotedesktop_tigervnc'
                arguments '-DANDROID_STL=c++_static'
                arguments "-DVENTO_RUST_LIBRARY_DIR=${rustLibraries}"
                // scripts/check-warnings.sh, and nothing in the path of building
                // the app: see backends/cmake/warnings.cmake.
                if (project.hasProperty('strictWarnings')) {
                    arguments '-DSTRICT_WARNINGS=ON'
                }
            }
        }
        ndk {
            // x86_64 is in that list; lint reads the literal and not the value.
            //noinspection ChromeOsAbiSupport
            abiFilters project(':backends').nativeAbis as String[]
        }
    }

    externalNativeBuild {
        cmake {
            path 'cpp/CMakeLists.txt'
            version = '3.30.5'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Not AGP's `src/main/`: `src/` here is the crate's. The Java is in
    // `java/`, without package directories (javac goes by the `package`
    // line), and the provider's registration is in `resources/`; the C++ is
    // `cpp/`, above.
    sourceSets.main {
        java.srcDirs = ['java']
        resources.srcDirs = ['resources']
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api project(':backends')
}

// No build from sources that look pristine but are not, or from an
// uninitialised submodule.
def patchCheck = tasks.register('patchCheck', PatchCheckTask) {
    patchScript.set(rootProject.file('patch.sh'))
}

tasks.named('preBuild') {
    dependsOn patchCheck
}

// `TigerVncCatalog`, what the catalog says this backend is, and `TigerVncNatives`, what
// the library registers its natives on: see :backends.
androidComponents {
    onVariants(selector().all()) { variant ->
        project(':backends').generateCatalog(project, variant, 'tigervnc', 'TigerVncCatalog')
        project(':backends').generateNatives(project, variant, 'TigerVncNatives', 'remotedesktop_tigervnc')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

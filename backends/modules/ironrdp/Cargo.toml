# The IronRDP backend's native code, structured like the RFB client since both
# implement `Backend`. IronRDP handles the protocol; this crate adds the
# threads, the framebuffer, the keysym map and the trust decision.
[package]
name = "remotedesktop-ironrdp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# `lib` for the tests and the example, `cdylib` for the library the app loads:
# one crate for one protocol. This is also the `.so` name; librdp.so is too
# generic a name for a library inside an APK.
name = "remotedesktop_ironrdp"
crate-type = ["lib", "cdylib"]

[dependencies]
log.workspace = true
remotedesktop-runtime.workspace = true

# `ironrdp-blocking` rather than the async one: this client owns its threads and
# blocks on a socket, which keeps a tokio runtime out of the app.
#
# From the submodule, at the commit IronRDP tagged these crates' releases on
# (`ironrdp-session` 0.12.0 and the rest). It was pinned to an unreleased
# commit while `ironrdp-session` 0.11.0 chunked a decoded bitmap by the
# *rectangle's* width where the protocol pads the bitmap's own width up to a
# multiple of four, so every update whose width was not a multiple of four
# sheared each row one step further left than the last (on xrdp, most of
# them); 0.12.0 has the fix. The paths are in the root `Cargo.toml`'s
# `[workspace.dependencies]`.
ironrdp-cliprdr.workspace = true
ironrdp-blocking.workspace = true
ironrdp-connector.workspace = true
ironrdp-displaycontrol.workspace = true
ironrdp-dvc.workspace = true
# The graphics pipeline (MS-RDPEGFX), with its H.264 decoded by the
# platform's video decoders (`src/pipeline.rs`).
ironrdp-egfx.workspace = true
ironrdp-core.workspace = true
ironrdp-graphics.workspace = true
ironrdp-input.workspace = true
ironrdp-pdu.workspace = true
# The server's sound, played on the session's output (`src/sound.rs`), and
# device redirection with no devices, without which Windows never starts sound.
ironrdp-rdpsnd.workspace = true
# Direct touch, over the touch input channel (`Client::touch`).
ironrdp-rdpei.workspace = true
ironrdp-rdpdr.workspace = true
ironrdp-session.workspace = true
ironrdp-svc.workspace = true

rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
# CredSSP binds the authentication to the TLS certificate's public key, so the
# SubjectPublicKeyInfo has to be extracted from the DER. A parser rather than a
# fixed offset, since this field's position must not be guessed.
x509-cert = { version = "0.2", default-features = false, features = ["pem"] }

# `src/backend.rs`, the protocol as an `api::Backend`, used by the Linux
# client directly and by the phone through its JNI layer.
remotedesktop-api.workspace = true

# The probe is a development tool, built only on request: `cargo run
# --features probe --example ironrdp-probe`. Without the feature, `cargo test`
# and `clippy --all-targets` skip it.
[features]
probe = []

[[example]]
name = "ironrdp-probe"
required-features = ["probe"]

# The only Android-specific part of this crate: the line in `src/lib.rs` that
# registers the backend with the platform crate's JNI layer.
[target.'cfg(target_os = "android")'.dependencies]
remotedesktop-platform-android.workspace = true

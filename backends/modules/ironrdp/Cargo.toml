# The RDP backend's native half, in the RFB client's shape because `Backend` is
# what both have to fit. Bound rather than written: what is ours is the threads,
# the framebuffer, the keysym map and the trust decision.
[package]
name = "remotedesktop-ironrdp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# `lib` for the tests and the example, `cdylib` for the library the app loads —
# one crate for one protocol. The name is the `.so`'s: librdp.so is too plain a
# name to put in somebody's APK.
name = "remotedesktop_ironrdp"
crate-type = ["lib", "cdylib"]

[dependencies]
log.workspace = true
remotedesktop-runtime.workspace = true

# `ironrdp-blocking` rather than the async one: this client owns its threads and
# blocks on a socket, which keeps a tokio runtime out of the app.
#
# A submodule pinned to a commit rather than the published versions, and not by
# preference:
# `ironrdp-session` 0.11.0 chunks a decoded bitmap by the *rectangle's* width
# where the protocol pads the bitmap's own width up to a multiple of four, so
# every update not a multiple of four wide shears one row further left than the
# last. On xrdp that is most of them. Fixed upstream and unreleased — revisit at
# the next release. The paths are the root `Cargo.toml`'s
# `[workspace.dependencies]`.
ironrdp-cliprdr.workspace = true
ironrdp-blocking.workspace = true
ironrdp-connector.workspace = true
ironrdp-displaycontrol.workspace = true
ironrdp-dvc.workspace = true
ironrdp-core.workspace = true
ironrdp-graphics.workspace = true
ironrdp-input.workspace = true
ironrdp-pdu.workspace = true
# The server's sound, played on the session's output (`src/sound.rs`), and
# device redirection with no devices, without which Windows never starts it.
ironrdp-rdpsnd.workspace = true
ironrdp-rdpdr.workspace = true
ironrdp-session.workspace = true
ironrdp-svc.workspace = true

rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
# CredSSP binds the authentication to the TLS certificate's public key, so the
# SubjectPublicKeyInfo has to come out of the DER. A parser rather than an
# offset: this is the one field whose position nobody should guess.
x509-cert = { version = "0.2", default-features = false, features = ["pem"] }

# `src/backend.rs`, the protocol as a `session::Backend`: what the phone's JNI
# layer stands in front of.
remotedesktop-session.workspace = true

# The probe is a development tool, built only when asked for: `cargo run
# --features probe --example ironrdp-probe`. Without the feature `cargo test` and
# `clippy --all-targets` leave it alone.
[features]
probe = []

[[example]]
name = "ironrdp-probe"
required-features = ["probe"]

# The only part of this crate that knows a phone exists: the one line in
# `src/lib.rs` that hands the backend to the platform crate's JNI layer.
[target.'cfg(target_os = "android")'.dependencies]
remotedesktop-platform-android.workspace = true

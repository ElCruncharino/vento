plugins {
    id 'com.android.library'
}

// Both halves of the RustDesk backend: the crate at this directory's root
// (`Cargo.toml`, `src/`), our own client, as the library the AAR carries, and
// `java/`'s provider, which holds a session on it as a `NativeBackend` through
// the natives class generated below. What ships it is `plugins/rustdesk` rather
// than the app.
android {
    namespace = 'net.pgaskin.remotedesktop.backend.rustdesk'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Not AGP's `src/main/`: `src/` here is the crate's. The Java is in
    // `java/`, the files themselves with no package directories over them
    // (javac goes by the `package` line), and the provider's registration is
    // in `resources/`.
    sourceSets.main {
        java.srcDirs = ['java']
        resources.srcDirs = ['resources']
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // The only thing of the app's this module may name. `api` because a
    // session here is a `Backend` and whoever holds one says so.
    api project(':backends')
}

// `libremotedesktop_rustdesk.so`, compiled by cargo-ndk into a generated
// jniLibs directory the AAR packages — which the add-on's APK then carries and
// the app loads out of that package's own library directory.
androidComponents {
    onVariants(selector().all()) { variant ->
        final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
        final seam = project(':backends')

        final cargoBuild = tasks.register("cargoBuild${cap}Native", CargoBuildTask) {
            workspaceDir.set(seam.cargoWorkspace)
            cargoPackage.set('remotedesktop-rustdesk')
            ndkDirectory.set(androidComponents.sdkComponents.ndkDirectory)
            rustToolchainFile.set(seam.cargoRustToolchain)
            cargoNdkVersion.set(seam.cargoNdkVersion)
            abiFilters.set(seam.nativeAbis)
            minSdkVersion.set(provider {
                final v = android.defaultConfig.minSdk
                (v instanceof com.android.build.api.variant.AndroidVersion) ? v.apiLevel : v
            })
            outputDir.set(layout.buildDirectory.dir("generated/rustNativeLibs/${variant.name}"))
        }
        variant.sources.jniLibs?.addGeneratedSourceDirectory(cargoBuild) { it.outputDir }

        // `RustDeskCatalog`, what the catalog says this backend is, and
        // `RustDeskNatives`, what the library registers its natives on — a class
        // of this module's, loaded from the add-on's own APK: see :backends.
        seam.generateCatalog(project, variant, 'rustdesk', 'RustDeskCatalog')
        seam.generateNatives(project, variant, 'RustDeskNatives', 'remotedesktop_rustdesk')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

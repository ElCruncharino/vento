# The RustDesk backend's native half. The protocol is plain Rust, and on
# Android the library is that client as an `api::Backend` (`src/backend.rs`)
# registered through the platform crate's shared JNI layer, so `cargo test` and
# `cargo run --features probe --example rustdesk-probe` exercise it on the
# host. Video is decoded by the `runtime::media::video::Decoders` the client is
# given: the phone's MediaCodec (see `src/lib.rs`), or libavcodec in the probe.
[package]
name = "remotedesktop-rustdesk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# `lib` for the tests, the example and the Linux client, `cdylib` for the
# library the app loads: one crate per protocol.
name = "remotedesktop_rustdesk"
crate-type = ["lib", "cdylib"]

[dependencies]
log.workspace = true
remotedesktop-runtime.workspace = true
# RustDesk's session cipher and signatures: xsalsa20-poly1305, curve25519 boxes
# and ed25519, the libsodium set that RustDesk links. Pure Rust, so no extra C
# library is needed.
dryoc = "0.7"
# For SO_REUSEPORT, which std does not expose: hole punching dials the peer
# from the same local port the rendezvous server saw.
socket2 = { version = "0.6", features = ["all"] } # SO_REUSEPORT needs "all"
# The crate RustDesk uses rather than prost, so the generated code matches
# what RustDesk's client generates from the same `.proto`.
# `protobuf-codegen`'s `.pure()` needs no `protoc`, a host tool this build
# would otherwise have to find and pin.
protobuf = "3.7"
# The password hash, two rounds of SHA-256.
sha2 = "0.11"
# Clipboard data and cursors are zstd-compressed. This is the only C
# dependency here, and it builds under the NDK without configuration.
zstd = "0.13"

# `src/backend.rs`, the protocol as an `api::Backend`, used directly by the
# Linux client and through the JNI layer on the phone.
remotedesktop-api.workspace = true

# The only Android-specific part of this crate: the `natives!` call in
# `src/lib.rs` that registers the backend with the platform crate's JNI layer,
# with that crate's MediaCodec decoder for video.
[target.'cfg(target_os = "android")'.dependencies]
remotedesktop-platform-android.workspace = true

# The probe decodes what it receives, using libavcodec on a host. Under the
# non-Android cfg, so neither the library the app loads nor its licence page
# includes FFmpeg, and optional, so that only the probe feature builds it:
# `cargo test` of this crate builds no FFmpeg. (Optional rather than a
# dev-dependency, since a dev-dependency cannot be optional; only the example
# uses it.)
[target.'cfg(not(target_os = "android"))'.dependencies]
remotedesktop-platform-linux = { workspace = true, optional = true }

# The probe is a development tool, built only on request: `cargo run
# --features probe --example rustdesk-probe`. Without the feature, `cargo test`
# and `clippy --all-targets` skip it.
[features]
probe = ["dep:remotedesktop-platform-linux"]

[[example]]
name = "rustdesk-probe"
required-features = ["probe"]

[build-dependencies]
protobuf-codegen = "3.7"

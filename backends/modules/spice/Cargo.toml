# The SPICE backend's native half: ryll's protocol and decoder crates under
# this crate's own session layer. The session layer is plain Rust; on Android
# the library exposes it as an `api::Backend` (`src/backend.rs`) registered
# through the platform crate's JNI layer, so `cargo test` and `cargo run
# --features probe --example spice-probe` exercise it on the host against a
# real server.
[package]
name = "remotedesktop-spice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# `lib` for the tests and the example, `cdylib` for the library the app loads.
name = "remotedesktop_spice"
crate-type = ["lib", "cdylib"]

[dependencies]
log.workspace = true
remotedesktop-runtime.workspace = true
# `src/backend.rs` implements `api::Backend`, used directly by the Linux
# client and through the JNI layer on Android.
remotedesktop-api.workspace = true

# A submodule rather than the published crates, because both needed changes
# before they would build for Android (`patches/ryll/`). The protocol crate's
# `client` module is unused: it has its own TLS setup with a bundled root store
# (922 KB), replaced here by `remotedesktop-runtime`'s pinning (`runtime::tls`).
# The paths, and `default-features = false`, are in the root `Cargo.toml`'s
# `[workspace.dependencies]`.
shakenfist-spice-protocol.workspace = true
shakenfist-spice-compression = { workspace = true, features = [
    "quic",
    "glz",
    "lz",
    "lz4",
    "jpeg", # images and MJPEG streams, through the pure-Rust decoder
] }

# The only async runtime in this repository, because a SPICE session is four
# sockets (five with audio) that have to be read concurrently, where a thread
# per socket is awkward. One current-thread runtime per session, run on the
# session's existing thread.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "net",
    "io-util",
    "time",
    "sync",
    "macros",
] }
# The TLS port, with `runtime::tls`'s verifier. No provider feature: the
# patched protocol crate uses the process-wide default, which `src/tls.rs`
# installs as `ring`.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
# ZLIB_GLZ_RGB, a GLZ image with a zlib wrapper. The RFB backend uses the same
# crate.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# The example's logger, for the client's warnings when there is no logcat.
log.workspace = true

# The probe is a development tool, built only when asked for: `cargo run
# --features probe --example spice-probe`. Without the feature `cargo test` and
# `clippy --all-targets` skip it.
[features]
probe = []

[[example]]
name = "spice-probe"
required-features = ["probe"]

# Used only by the line in `src/lib.rs` that registers the backend with the
# platform crate's JNI layer.
[target.'cfg(target_os = "android")'.dependencies]
remotedesktop-platform-android.workspace = true

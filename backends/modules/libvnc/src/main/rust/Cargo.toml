# The libvncclient backend as the phone holds it: its `Kind`, over the one
# adapter for the C backends (`remotedesktop-session`'s `c` feature), with
# this backend's own config, live options and info rows. The library is the
# shim in `src/main/cpp` over LibVNCServer's client half, built by CMake, and
# whatever links this crate links that library too: nothing here links on its
# own, which is why there is no test binary.
[package]
name = "remotedesktop-libvnc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "remotedesktop_libvnc"
test = false
doctest = false

[dependencies]
log.workspace = true
remotedesktop-session = { workspace = true, features = ["c"] }

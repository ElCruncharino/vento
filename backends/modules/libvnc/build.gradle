plugins {
    id 'com.android.library'
}

// The libvncclient backend has three parts: `cpp/`, a platform-independent
// shim over LibVNCServer's client; the crate at this directory's root
// (`Cargo.toml`, `src/`), which wraps the shim as an `api::Backend` (used
// directly by the Linux client) and registers the shared JNI layer on the
// generated natives class; and the provider in `java/`, which holds a session
// as a `NativeBackend`. The AAR carries the single library CMake links the
// first two into.
//
// The library itself is not in this directory: it is `third_party/libvncserver`,
// a submodule at the repository root, pinned by its gitlink and patched from
// `patches/libvncserver/`.

// The crate at this directory's root, as the static library CMake links in:
// see `rustStaticLibrary` in :backends.
final rustLibraries = project(':backends').rustStaticLibrary(project, 'remotedesktop-libvnc')

android {
    namespace = 'net.pgaskin.remotedesktop.backend.libvnc'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 34
        externalNativeBuild {
            cmake {
                targets 'remotedesktop_libvnc'
                arguments "-DVENTO_RUST_LIBRARY_DIR=${rustLibraries}"
                // Set by scripts/check-warnings.sh, not by normal app builds: see
                // backends/cmake/warnings.cmake.
                if (project.hasProperty('strictWarnings')) {
                    arguments '-DSTRICT_WARNINGS=ON'
                }
            }
        }
        ndk {
            // x86_64 is in that list; lint reads the literal and not the value.
            //noinspection ChromeOsAbiSupport
            abiFilters project(':backends').nativeAbis as String[]
        }
    }

    externalNativeBuild {
        cmake {
            path 'cpp/CMakeLists.txt'
            version = '3.30.5'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Not AGP's `src/main/`: `src/` here is the crate's. The Java is in
    // `java/`, with no package directories (javac goes by the `package`
    // line), and the provider's registration is in `resources/`; the C is in
    // `cpp/`, above.
    sourceSets.main {
        java.srcDirs = ['java']
        resources.srcDirs = ['resources']
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api project(':backends')
}

// Fails the build if the submodule is not initialised or its patches are not
// applied (`patch.sh check`).
def patchCheck = tasks.register('patchCheck', PatchCheckTask) {
    patchScript.set(rootProject.file('patch.sh'))
}

tasks.named('preBuild') {
    dependsOn patchCheck
}

// `LibVncCatalog`, this backend's catalog entry, and `LibVncNatives`, the class
// the library registers its natives on: see :backends.
androidComponents {
    onVariants(selector().all()) { variant ->
        project(':backends').generateCatalog(project, variant, 'libvnc', 'LibVncCatalog')
        project(':backends').generateNatives(project, variant, 'LibVncNatives', 'remotedesktop_libvnc')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

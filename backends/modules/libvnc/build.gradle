plugins {
    id 'com.android.library'
}

// The three parts of the libvncclient backend: `src/main/cpp`, a shim over
// LibVNCServer's client that names no platform; `src/main/rust`, the backend
// as a `session::Backend` over it and the JNI layer every backend shares,
// registered on the generated natives class; and `src/main/java`'s provider,
// which holds a session as a `NativeBackend`. The AAR carries the one library
// CMake links the first two into.
//
// The one structural difference from the other protocol modules is that the
// native half is not in this directory: it is `third_party/libvncserver`, a
// submodule at the repository root, pinned by its gitlink and patched — if at
// all — from `patches/`.

// The crate in `src/main/rust`, as the static library CMake links in: see
// `rustStaticLibrary` in :backends.
final rustLibraries = project(':backends').rustStaticLibrary(project, 'remotedesktop-libvnc')

android {
    namespace = 'net.pgaskin.remotedesktop.backend.libvnc'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 34
        externalNativeBuild {
            cmake {
                targets 'remotedesktop_libvnc'
                arguments "-DVENTO_RUST_LIBRARY_DIR=${rustLibraries}"
                // scripts/check-warnings.sh, and nothing in the path of building
                // the app: see backends/cmake/warnings.cmake.
                if (project.hasProperty('strictWarnings')) {
                    arguments '-DSTRICT_WARNINGS=ON'
                }
            }
        }
        ndk {
            // x86_64 is in that list; lint reads the literal and not the value.
            //noinspection ChromeOsAbiSupport
            abiFilters project(':backends').nativeAbis as String[]
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version = '3.30.5'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api project(':backends')
}

// A build must not come out of sources that look pristine and are not, nor out
// of a submodule nobody has initialised.
def patchCheck = tasks.register('patchCheck', PatchCheckTask) {
    patchScript.set(rootProject.file('patch.sh'))
}

tasks.named('preBuild') {
    dependsOn patchCheck
}

// `LibVncCatalog`, what the catalog says this backend is, and `LibVncNatives`, what
// the library registers its natives on: see :backends.
androidComponents {
    onVariants(selector().all()) { variant ->
        project(':backends').generateCatalog(project, variant, 'libvnc', 'LibVncCatalog')
        project(':backends').generateNatives(project, variant, 'LibVncNatives', 'remotedesktop_libvnc')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

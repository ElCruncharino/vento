plugins {
    id 'com.android.library'
}

// The FreeRDP backend has three parts: `cpp/`, a platform-independent shim
// over FreeRDP's client; the crate at this directory's root (`Cargo.toml`,
// `src/`), which wraps the shim as an `api::Backend` (used directly by the
// Linux client) and registers the shared JNI layer on the generated natives
// class; and the provider in `java/`, which holds a session as a
// `NativeBackend` with the RDP hooks. The AAR carries the single library CMake
// links the first two into.
//
// As with the libvncclient and TigerVNC backends, the native client is not in
// this directory: it is `third_party/freerdp`, a submodule at the repository
// root, plus its dependency `backends/platform/android/ports/openssl` (FreeRDP
// uses only OpenSSL for crypto). OpenSSL is 64% of what this backend adds to a
// build.

// Builds the crate at this directory's root as the static library CMake links
// in: see `rustStaticLibrary` in :backends.
final rustLibraries = project(':backends').rustStaticLibrary(project, 'remotedesktop-freerdp')

android {
    namespace = 'net.pgaskin.remotedesktop.backend.freerdp'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 34
        externalNativeBuild {
            cmake {
                targets 'remotedesktop_freerdp'
                arguments "-DVENTO_RUST_LIBRARY_DIR=${rustLibraries}"
                // Set only by scripts/check-warnings.sh, not by app builds: see
                // backends/cmake/warnings.cmake.
                if (project.hasProperty('strictWarnings')) {
                    arguments '-DSTRICT_WARNINGS=ON'
                }
            }
        }
        ndk {
            // x86_64 is in that list; lint reads the literal and not the value.
            //noinspection ChromeOsAbiSupport
            abiFilters project(':backends').nativeAbis as String[]
        }
    }

    externalNativeBuild {
        cmake {
            path 'cpp/CMakeLists.txt'
            version = '3.30.5'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Not AGP's `src/main/`: `src/` here is the crate's. The Java is in
    // `java/` without package directories (javac uses the `package` line), the
    // provider's registration is in `resources/`, and the C is in `cpp/`
    // (above).
    sourceSets.main {
        java.srcDirs = ['java']
        resources.srcDirs = ['resources']
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api project(':backends')
}

// Fails the build if a submodule is not initialised or its patches are not
// applied (`patch.sh check`).
def patchCheck = tasks.register('patchCheck', PatchCheckTask) {
    patchScript.set(rootProject.file('patch.sh'))
}

tasks.named('preBuild') {
    dependsOn patchCheck
}

// Generates `FreeRdpCatalog` (this backend's catalog entry) and `FreeRdpNatives`
// (the class the library registers its natives on): see :backends.
androidComponents {
    onVariants(selector().all()) { variant ->
        project(':backends').generateCatalog(project, variant, 'freerdp', 'FreeRdpCatalog')
        project(':backends').generateNatives(project, variant, 'FreeRdpNatives', 'remotedesktop_freerdp')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

plugins {
    id 'com.android.library'
}

// The three parts of the FreeRDP backend: `cpp/`, a shim over FreeRDP's own
// client that names no platform; the crate at this directory's root
// (`Cargo.toml`, `src/`), the backend as an `api::Backend` over it — the one
// the Linux client holds — and the JNI layer every backend shares, registered
// on the generated natives class; and `java/`'s provider, which holds a session
// as a `NativeBackend` with the RDP hooks. The AAR carries the one library
// CMake links the first two into.
//
// As with the two borrowed VNC clients, the native half is not in this
// directory: it is `third_party/freerdp`, a submodule at the repository root
// pinned by its gitlink — and, under it, `backends/platform/android/ports/
// openssl`, since RDP's crypto is OpenSSL and nothing else, which is 64% of
// what this backend adds to a build.

// The crate at this directory's root, as the static library CMake links in:
// see `rustStaticLibrary` in :backends.
final rustLibraries = project(':backends').rustStaticLibrary(project, 'remotedesktop-freerdp')

android {
    namespace = 'net.pgaskin.remotedesktop.backend.freerdp'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 34
        externalNativeBuild {
            cmake {
                targets 'remotedesktop_freerdp'
                arguments "-DVENTO_RUST_LIBRARY_DIR=${rustLibraries}"
                // scripts/check-warnings.sh, and nothing in the path of building
                // the app: see backends/cmake/warnings.cmake.
                if (project.hasProperty('strictWarnings')) {
                    arguments '-DSTRICT_WARNINGS=ON'
                }
            }
        }
        ndk {
            // x86_64 is in that list; lint reads the literal and not the value.
            //noinspection ChromeOsAbiSupport
            abiFilters project(':backends').nativeAbis as String[]
        }
    }

    externalNativeBuild {
        cmake {
            path 'cpp/CMakeLists.txt'
            version = '3.30.5'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Not AGP's `src/main/`: `src/` here is the crate's. The Java is in
    // `java/`, the files themselves with no package directories over them
    // (javac goes by the `package` line), and the provider's registration is
    // in `resources/`; the C is `cpp/`, above.
    sourceSets.main {
        java.srcDirs = ['java']
        resources.srcDirs = ['resources']
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api project(':backends')
}

// A build must not come out of sources that look pristine and are not, nor out
// of a submodule nobody has initialised.
def patchCheck = tasks.register('patchCheck', PatchCheckTask) {
    patchScript.set(rootProject.file('patch.sh'))
}

tasks.named('preBuild') {
    dependsOn patchCheck
}

// `FreeRdpCatalog`, what the catalog says this backend is, and `FreeRdpNatives`, what
// the library registers its natives on: see :backends.
androidComponents {
    onVariants(selector().all()) { variant ->
        project(':backends').generateCatalog(project, variant, 'freerdp', 'FreeRdpCatalog')
        project(':backends').generateNatives(project, variant, 'FreeRdpNatives', 'remotedesktop_freerdp')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

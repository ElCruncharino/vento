# The FreeRDP backend as the clients hold it: its `Kind`, over the one
# adapter for the C backends (`remotedesktop-api`'s `c` feature), with
# this backend's own config, live options and info rows. The library is the
# shim in `cpp/` over libfreerdp, built by CMake, which the Linux client
# opens at run time (`api::c::library`) and the phone's library links
# together with this crate: nothing here links it, which is why there is no
# test binary.
[package]
name = "remotedesktop-freerdp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "remotedesktop_freerdp"
test = false
doctest = false

[dependencies]
log.workspace = true
remotedesktop-api = { workspace = true, features = ["c"] }

# On Linux, what the table build.rs generates over the header's functions
# is written over: dlopen and dlsym, and an error that says which. Already in
# the graph through bindgen's libclang.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

# The phone's half: the one JNI layer, registered on this module's generated
# natives class from the `JNI_OnLoad` in `src/lib.rs`. The library the app
# loads is still the one CMake links; this crate goes into it as a static
# library (`CargoBuildTask` with `crateType = 'staticlib'`).
[target.'cfg(target_os = "android")'.dependencies]
remotedesktop-platform-android.workspace = true

[build-dependencies]
# `vento/freerdp.h`, read rather than retyped (build.rs), as the `api` crate
# reads the shared headers.
bindgen.workspace = true

# The FreeRDP backend as the phone holds it: its `Kind`, over the one
# adapter for the C backends (`remotedesktop-session`'s `c` feature), with
# this backend's own config, live options and info rows. The library is the
# shim in `cpp/` over libfreerdp, built by CMake, and whatever links this
# crate links that library too: nothing here links on its own, which is why
# there is no test binary.
[package]
name = "remotedesktop-freerdp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "remotedesktop_freerdp"
test = false
doctest = false

[dependencies]
log.workspace = true
remotedesktop-session = { workspace = true, features = ["c"] }

# The phone's half: the one JNI layer, registered on this module's generated
# natives class from the `JNI_OnLoad` in `src/lib.rs`. The library the app
# loads is still the one CMake links; this crate goes into it as a static
# library (`CargoBuildTask` with `crateType = 'staticlib'`).
[target.'cfg(target_os = "android")'.dependencies]
remotedesktop-platform-android.workspace = true

[build-dependencies]
# `vento/freerdp.h`, read rather than retyped (build.rs), as the session crate
# reads the shared headers.
bindgen.workspace = true

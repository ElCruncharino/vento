plugins {
    id 'com.android.library'
}

// Both halves of the RFB backend: `src/main/rust`, our own client, as the
// library the AAR carries, and `src/main/java`'s provider, which holds a
// session on it as a `NativeBackend` through the natives class generated below.
android {
    namespace = 'net.pgaskin.remotedesktop.backend.rfb'
    compileSdk 36
    ndkVersion = project(':backends').nativeNdkVersion

    defaultConfig {
        minSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // The AAR carries the library too, so speaking RFB is a dependency line.
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // The only thing of the app's this module may name. `api` because a
    // session here is a `Backend` and whoever holds one says so.
    api project(':backends')
}

// `libremotedesktop_rfb.so`, compiled by cargo-ndk into a generated jniLibs
// directory the AAR packages. Every variant: both flavours get this client.
androidComponents {
    onVariants(selector().all()) { variant ->
        final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
        final seam = project(':backends')

        final cargoBuild = tasks.register("cargoBuild${cap}Native", CargoBuildTask) {
            workspaceDir.set(seam.cargoWorkspace)
            cargoPackage.set('remotedesktop-rfb')
            ndkDirectory.set(androidComponents.sdkComponents.ndkDirectory)
            rustToolchainFile.set(seam.cargoRustToolchain)
            cargoNdkVersion.set(seam.cargoNdkVersion)
            abiFilters.set(seam.nativeAbis)
            minSdkVersion.set(provider {
                final v = android.defaultConfig.minSdk
                (v instanceof com.android.build.api.variant.AndroidVersion) ? v.apiLevel : v
            })
            outputDir.set(layout.buildDirectory.dir("generated/rustNativeLibs/${variant.name}"))
        }
        variant.sources.jniLibs?.addGeneratedSourceDirectory(cargoBuild) { it.outputDir }

        // `RfbCatalog`, what the catalog says this backend is, and
        // `RfbNatives`, what the library registers its natives on: see :backends.
        seam.generateCatalog(project, variant, 'rfb', 'RfbCatalog')
        seam.generateNatives(project, variant, 'RfbNatives', 'remotedesktop_rfb')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

# What every client here speaks to and no protocol owns: the `Handler` a
# protocol thread calls, the `Events` a platform answers it with, the `Session`
# that runs one on a thread of its own — and the address parser, which is the
# one thing every client does before any of that.
#
# Nothing in here knows what a phone is. The Android half of a backend is
# `remotedesktop-platform-android`, which depends on this crate and not the
# other way round, so a client can be built on this layer without a `jni`
# anywhere in its graph. Everything that is about TLS rather than about a
# session is `remotedesktop-tls`, and why the two are separate crates is in
# that one's manifest.
[package]
name = "remotedesktop-common"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "common"

[dependencies]
log.workspace = true

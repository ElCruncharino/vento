# The picture and the sound a session carries, where a protocol sends them
# as media: the video decoders a platform supplies and what is done with
# their planes afterwards (`video`), and the far end's sound — the output a
# platform supplies, its decoders, and the queue between a protocol thread
# and a device (`audio`). The same for every protocol that has either, and
# for both platforms, which implement its two traits (`video::Decoders`,
# `audio::Outputs`) and hand them to the session.
#
# Beside `remotedesktop-runtime` rather than in it or over it: nothing here
# needs a handler, a session or an event, and nothing there needs a frame or
# a sample, so neither crate depends on the other. `remotedesktop-api`
# holds both. The Linux platform crate depends on this one alone.
[package]
name = "remotedesktop-media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "media"

[dependencies]
log.workspace = true

# The Android side of a backend's native half, apart from any protocol: the
# JNI layer every backend except RealVNC is reached through (any
# `api::Backend`, registered on its module's natives class), the locked
# bitmap, the logger, and MediaCodec and AAudio for video, audio decoding and
# sound output, reached through the NDK rather than through Java.
#
# This is the only crate in the workspace with `jni` in it. A protocol crate
# depends on it only under a target cfg, which keeps the host build (tests,
# examples, `remotedesktop-platform-linux`) free of Android code. Neither
# `remotedesktop-runtime` nor `remotedesktop-api` depends on it: the layering
# runs the other way. This crate holds an `api::Backend` for Java and
# implements `runtime::media::video::Decoders` for MediaCodec, and neither
# `runtime` nor `api` knows about either.
#
# On a host target the crate is only the JNI table: plain data, no
# dependencies to fetch, read by `vento-codegen` (`codegen/`) to write each
# module's natives class.
#
# The directory holds the whole Android platform, not only this crate:
# `java/` is the Java every backend's provider is written against (`Backend`,
# `NativeBackend` and the rest, the `:backends` Gradle module's Java, whose
# natives this crate implements), and `javatest/` holds its tests;
# `backends/build.gradle` points AGP at both. `codegen/` is a separate crate,
# `remotedesktop-codegen`, the host tool that writes each module's generated
# Java from `api` and this crate's table. It is a workspace member and not
# part of this package (cargo leaves a directory with its own manifest out of
# the package above it).
[package]
name = "remotedesktop-platform-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "platform_android"

[target.'cfg(target_os = "android")'.dependencies]
log.workspace = true
remotedesktop-runtime.workspace = true
remotedesktop-api.workspace = true
jni.workspace = true
android_logger.workspace = true

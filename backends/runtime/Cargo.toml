# What every protocol here is written against and no protocol owns: the
# `Client` a protocol implements, the `Handler` its thread calls, the `Events`
# a platform answers it with, the `Session` that runs one on a thread of its
# own and the `Bridge` between them, the dial a hang-up can interrupt, the
# pinned TLS of the protocols that reach it — and the address parser, which
# is the one thing every client does before any of that. The picture and the
# sound a session carries are `remotedesktop-media`'s, which needs nothing of
# this crate and this crate nothing of it.
#
# Nothing in here knows what a phone is. The Android half of a backend is
# `remotedesktop-platform-android`, which depends on this crate and not the
# other way round, so a desktop client can be built on this layer without a
# `jni` anywhere in its graph.
[package]
name = "remotedesktop-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "runtime"

[dependencies]
log.workspace = true
# The dial a disconnect can interrupt (`src/hangup.rs`): a socket made before
# it connects, which std does not offer, and the `poll` that waits on it.
# Both were in the lock already: RustDesk dials with socket2, and libc is
# under most of what is here.
socket2 = "0.6"
libc = "0.2"
# TLS as the protocols that reach it speak it (`src/tls/`): the pin, which is
# a SHA-256 of the certificate, and the connection two threads share. `ring`
# because aws-lc-rs wants cmake and bindgen for Android. No `webpki-roots`:
# what replaces an authority here is a pin.
#
# Here for every crate that depends on this one, a protocol that reaches no
# TLS included, and named on each such artefact's licence page, since the
# page is generated from the dependency graph and not from what the linker
# kept: a library that never calls into `tls` carries none of it.
sha2 = "0.11"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

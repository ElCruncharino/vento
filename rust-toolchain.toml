# CargoBuildTask checks `rustc --version` against this channel before it runs
# anything, so an unexpected compiler fails the build up front.
#
# The targets must cover `nativeAbis` in backends/build.gradle, of which the
# app's `ndk.abiFilters` is a subset: a backend library missing for a shipped
# ABI makes System.loadLibrary fail on devices of that ABI.
[toolchain]
channel = "1.96.0"
components = ["clippy", "rustfmt"]
targets = [
    "aarch64-linux-android",
    "x86_64-linux-android",
]

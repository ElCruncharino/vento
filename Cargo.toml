# Every crate is under `backends/`, inside the Gradle module that packages it,
# but the workspace root is here because that is where cargo and rust-analyzer
# look for one. The members are named one by one: a backend's crate is its
# module's directory, `backends/modules/<name>/`, except RealVNC's, which has
# none, so adding a protocol is a line in each list below.
#
# The layering is the point. `backends/runtime` is the neutral layer a
# protocol is written against and a platform is written to — the handler, the
# events, the thread a session runs on, its TLS, and the picture and the sound
# (`runtime::media`), which a protocol hands on without knowing whose decoders
# or output take them; `backends/session` is the one a client holds a session by — the `Backend` trait, the events, the options and the rules every client
# keeps alike — and each backend's adapter to it lives in that backend's own
# crate under `backends/modules/`: the protocol crate for the four in Rust, a
# small crate beside the C library for the others. None of them knows a
# phone. `backends/platform/*` is where one platform's glue lives — Android's
# JNI and MediaCodec in `android`. What a platform supplies, it supplies by
# implementing a trait of `runtime`'s (`Events`, `media::video::Decoders`,
# `media::audio::Outputs`) and handing it to the session, so no protocol crate
# says which platform it is on. A protocol crate depends on the platform crate
# only under a target cfg, `android`, for the library the app loads, so the host
# build never sees it.
[workspace]
resolver = "2"
members = [
    "backends/runtime",
    "backends/session",
    "backends/codegen",
    "backends/platform/*",
    "backends/modules/rfb",
    "backends/modules/ironrdp",
    "backends/modules/spice",
    "backends/modules/rustdesk",
    "backends/modules/libvnc",
    "backends/modules/tigervnc",
    "backends/modules/freerdp",
]
exclude = ["third_party"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
remotedesktop-runtime = { path = "backends/runtime", version = "0.0.1" }
remotedesktop-session = { path = "backends/session", version = "0.0.1" }
remotedesktop-platform-android = { path = "backends/platform/android", version = "0.0.1" }
log = "0.4"
# One version across the crates: a `Callbacks` built in one is used in another.
jni = "0.22"
android_logger = "0.15"
# One version for every crate that reads the C headers: `remotedesktop-session`
# the shared ones, each C backend's crate its own over those.
bindgen = "0.73"
# The upstreams that are submodules rather than registry crates, named from
# here so that a crate's distance from `third_party/` is nobody's concern:
# IronRDP at a commit (why: `modules/ironrdp/Cargo.toml`) and ryll's SPICE
# crates, patched (`modules/spice/Cargo.toml`).
ironrdp-blocking = { path = "third_party/ironrdp/crates/ironrdp-blocking" }
ironrdp-cliprdr = { path = "third_party/ironrdp/crates/ironrdp-cliprdr" }
ironrdp-connector = { path = "third_party/ironrdp/crates/ironrdp-connector" }
ironrdp-core = { path = "third_party/ironrdp/crates/ironrdp-core" }
ironrdp-displaycontrol = { path = "third_party/ironrdp/crates/ironrdp-displaycontrol" }
ironrdp-dvc = { path = "third_party/ironrdp/crates/ironrdp-dvc" }
ironrdp-graphics = { path = "third_party/ironrdp/crates/ironrdp-graphics" }
ironrdp-input = { path = "third_party/ironrdp/crates/ironrdp-input" }
ironrdp-pdu = { path = "third_party/ironrdp/crates/ironrdp-pdu" }
ironrdp-rdpdr = { path = "third_party/ironrdp/crates/ironrdp-rdpdr" }
ironrdp-rdpsnd = { path = "third_party/ironrdp/crates/ironrdp-rdpsnd" }
ironrdp-session = { path = "third_party/ironrdp/crates/ironrdp-session" }
ironrdp-svc = { path = "third_party/ironrdp/crates/ironrdp-svc" }
shakenfist-spice-protocol = { path = "third_party/ryll/shakenfist-spice-protocol", default-features = false }
shakenfist-spice-compression = { path = "third_party/ryll/shakenfist-spice-compression", default-features = false }

[profile.release]
panic = "abort" # cannot unwind across jni

# Every crate is under `backends/`, inside the Gradle module that packages it,
# but the workspace root is here because that is where cargo and rust-analyzer
# look for one. Members are globs: adding a protocol is adding a directory under
# `backends/modules/`.
#
# Three kinds of crate, and the layering is the point: `backends/common` is the
# neutral layer every client speaks to, the protocol crates are written against
# it and know nothing of a phone, and `backends/platform/*` is where one
# platform's glue lives — Android's JNI and MediaCodec in `android`, libavcodec
# in `desktop`. What a platform supplies, it supplies by implementing a trait of
# `common`'s (`Events`, `video::Decoders`) and handing it to the session, so no
# protocol crate says which platform it is on. A protocol crate depends on a
# platform crate only under a target cfg — `android` for the library the app
# loads, `desktop` for its probe — so neither build sees the other's.
[workspace]
resolver = "2"
members = [
    "backends/common",
    "backends/tls",
    "backends/platform/*",
    "backends/modules/*/src/main/rust",
]
exclude = ["third_party"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
remotedesktop-common = { path = "backends/common", version = "0.0.1" }
remotedesktop-tls = { path = "backends/tls", version = "0.0.1" }
remotedesktop-platform-android = { path = "backends/platform/android", version = "0.0.1" }
remotedesktop-platform-desktop = { path = "backends/platform/desktop", version = "0.0.1" }
log = "0.4"
# One version across the crates: a `Callbacks` built in one is used in another.
jni = "0.22"
android_logger = "0.15"

[profile.release]
panic = "abort" # cannot unwind across jni

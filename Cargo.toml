# Every crate is under `backends/`, inside the Gradle module that packages it,
# but the workspace root is here because that is where cargo and rust-analyzer
# look for one. Members are globs: adding a protocol is adding a directory under
# `backends/modules/`.
#
# The layering is the point. `backends/common` is the neutral layer a protocol
# is written against; `backends/session` is the one a client holds a session
# by — the `Backend` trait, the events, the options and the rules every client
# keeps alike — and each backend's adapter to it lives in that backend's own
# crate under `backends/modules/`: the protocol crate for the four in Rust, a
# small crate beside the C library for the others. None of them knows a
# phone. `backends/platform/*` is where one platform's glue lives — Android's
# JNI and MediaCodec in `android`, libavcodec in `desktop`. The one client
# that is not a phone's is `linux/`: a desktop binary that holds a session on
# any of the eight backends through those adapters, with the C libraries its
# build.rs has CMake make. It is a workspace of its own, excluded here, and not for
# want of trying it as a member: Cargo unifies features across a workspace
# for every platform at once, so the window's GUI stack switched on optional
# features of crates the phone shares (`bytemuck/derive`, `zerocopy/derive`)
# and their proc-macro crates appeared in the app's licence page — `cargo
# metadata --filter-platform` filters packages, not features. Its own lock
# file keeps all of that out of this graph; it reaches these crates by path.
# What a platform supplies, it supplies by implementing a trait of
# `common`'s (`Events`, `video::Decoders`) and handing it to the session, so no
# protocol crate says which platform it is on. A protocol crate depends on a
# platform crate only under a target cfg — `android` for the library the app
# loads, `desktop` for its probe — so neither build sees the other's.
[workspace]
resolver = "2"
members = [
    "backends/common",
    "backends/session",
    "backends/codegen",
    "backends/tls",
    "backends/platform/*",
    "backends/modules/*/src/main/rust",
]
exclude = ["third_party", "linux"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
remotedesktop-common = { path = "backends/common", version = "0.0.1" }
remotedesktop-session = { path = "backends/session", version = "0.0.1" }
remotedesktop-tls = { path = "backends/tls", version = "0.0.1" }
remotedesktop-platform-android = { path = "backends/platform/android", version = "0.0.1" }
remotedesktop-platform-desktop = { path = "backends/platform/desktop", version = "0.0.1" }
log = "0.4"
# One version across the crates: a `Callbacks` built in one is used in another.
jni = "0.22"
android_logger = "0.15"

[profile.release]
panic = "abort" # cannot unwind across jni

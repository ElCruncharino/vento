# Every crate is under `backends/`, inside the Gradle module that packages it,
# but the workspace root is here because that is where cargo and rust-analyzer
# look for one. Members are globs: adding a protocol is adding a directory under
# `backends/modules/`.
#
# The layering is the point. `backends/common` is the neutral layer a protocol
# is written against; `backends/session` is the one a client holds a session
# by — the `Backend` trait, the events, the options and the rules every client
# keeps alike — and each backend's adapter to it lives in that backend's own
# crate under `backends/modules/`: the protocol crate for the four in Rust, a
# small crate beside the C library for the others. None of them knows a
# phone. `backends/platform/*` is where one platform's glue lives — Android's
# JNI and MediaCodec in `android`. What a platform supplies, it supplies by
# implementing a trait of `common`'s (`Events`, `video::Decoders`) and handing
# it to the session, so no protocol crate says which platform it is on. A
# protocol crate depends on the platform crate only under a target cfg,
# `android`, for the library the app loads, so the host build never sees it.
[workspace]
resolver = "2"
members = [
    "backends/common",
    "backends/session",
    "backends/tls",
    "backends/platform/*",
    "backends/modules/*/src/main/rust",
]
exclude = ["third_party"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
remotedesktop-common = { path = "backends/common", version = "0.0.1" }
remotedesktop-session = { path = "backends/session", version = "0.0.1" }
remotedesktop-tls = { path = "backends/tls", version = "0.0.1" }
remotedesktop-platform-android = { path = "backends/platform/android", version = "0.0.1" }
log = "0.4"
# One version across the crates: a `Callbacks` built in one is used in another.
jni = "0.22"
android_logger = "0.15"

[profile.release]
panic = "abort" # cannot unwind across jni

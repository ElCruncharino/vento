// An add-on's licence page, in the APK that needs one.
//
// The app's page lists what the *app* contains, and an add-on is a separate
// build under different terms, so an add-on that includes third-party code
// lists it in its own generated page, which the app shows next to that
// backend's rows when the add-on's package has one. An add-on made only of
// this project's code needs no page and does not apply this: `plugins/realvnc`
// is that case, and the app's page already gives those terms in full for the
// same code.
//
// The contract is the asset's path, `licenses/index.html`, where the app
// looks for it. Applied as:
//
//     apply from: rootProject.file('plugins/licenses.gradle')
//     licensePage(
//         cargoPackages: ['remotedesktop-something'],
//         firstParty: [[name: …, spdx: …, text: …]],
//         otherComponents: provider { [[name: …, spdx: …, text: …]] })
//
// `otherComponents` can be a list or a provider of one. Texts read from
// third_party/ go in a provider, through GenerateLicensesTask.licenceText, so
// the project still configures in a clone without submodules.

ext.licensePage = { Map spec ->
    androidComponents {
        onVariants(selector().all()) { variant ->
            final cap = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
            final generate = tasks.register("generate${cap}Licenses", GenerateLicensesTask) {
                cargoLock.set(rootProject.file('Cargo.lock'))
                workspaceDir.set(project(':backends').cargoWorkspace)
                // What this APK ships, a subset of the workspace: the page
                // describes the artefact rather than the repository.
                cargoPackages.set(spec.cargoPackages as Set)
                abiFilters.set(android.defaultConfig.ndk.abiFilters as Set)
                ownHeading.set('This add-on')
                firstParty.set(spec.firstParty as List)
                otherComponents.set(spec.otherComponents)
            }
            variant.sources.assets?.addGeneratedSourceDirectory(generate) { it.assetsOutputDir }
        }
    }
}

plugins {
    id 'com.android.application' version '9.3.1' apply false
    id 'com.android.library' version '9.3.1' apply false
}

// Every javac lint, in every module, and none of them fatal: a build that fails
// on a warning cannot be made on a different JDK, and that includes the
// reproducible-build check, which exists so that a third party can rebuild it.
// `-PstrictWarnings`, passed by `scripts/check-warnings.sh` (which documents
// the policy), makes them fatal. The one Android Lint check disabled outright
// is in app/build.gradle.
allprojects {
    final strict = project.hasProperty('strictWarnings')
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Xlint:all'
        if (strict) {
            options.compilerArgs << '-Werror'
        }
    }
    // Three of Android Lint's checks are upgrade notices: a newer Android Gradle
    // plugin, a newer dependency version, a newer targetSdk. None is a defect,
    // and treating them as warnings would fail the strict build on upstream
    // releases rather than on changes here. They are informational in every
    // module, so the report holds findings only.
    ['com.android.application', 'com.android.library'].each { id ->
        plugins.withId(id) {
            android.lint.informational 'AndroidGradlePluginVersion', 'GradleDependency',
                    'OldTargetApi'
            android.lint.warningsAsErrors = strict
        }
    }
}
